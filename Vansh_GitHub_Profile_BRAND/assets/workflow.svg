<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0A09"/>
      <stop offset="1" stop-color="#1A1311"/>
    </linearGradient>
    <pattern id="canvas" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#2A221F"/>
    </pattern>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="430" rx="24"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,Menlo,monospace; }
      .sans { font-family: 'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif; }
      .wire { stroke-dasharray: 3 8; animation: flow 1s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -22; } }
      .nd { animation: run 4.2s ease-in-out infinite; }
      .t1 { animation-delay: .6s; } .t2 { animation-delay: 1.2s; } .t3 { animation-delay: 1.8s; } .t4 { animation-delay: 2.4s; } .t5 { animation-delay: 3s; } .t6 { animation-delay: 3.6s; }
      @keyframes run { 0%,100% { stroke: #3A2F2B; } 12% { stroke: #FF8A50; } 30% { stroke: #3A2F2B; } }
      .ok { animation: live 1.5s ease-in-out infinite; }
      @keyframes live { 50% { opacity: .3; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="url(#canvas)"/>

    <!-- toolbar -->
    <rect x="0" y="0" width="1200" height="52" fill="#120E0C"/>
    <line x1="0" y1="52" x2="1200" y2="52" stroke="#2E2522"/>
    <text x="32" y="32" class="mono" font-size="14" fill="#F5F5F4">⚙ ICP Lead Engine</text>
    <text x="210" y="32" class="mono" font-size="12" fill="#78716C">/ production / n8n</text>
    <rect x="1010" y="15" width="160" height="24" rx="12" fill="#13201A" stroke="#34D399" stroke-opacity=".5"/>
    <circle class="ok" cx="1028" cy="27" r="4.5" fill="#34D399"/>
    <text x="1040" y="31" class="mono" font-size="12" fill="#86EFAC">Active · prod</text>

    <!-- wires (base) -->
    <g fill="none" stroke="#3A2F2B" stroke-width="2.4">
      <path d="M136 220 C176 220,174 220,214 220"/>
      <path d="M306 220 C346 220,344 220,384 220"/>
      <path d="M476 220 C516 220,514 220,554 220"/>
      <path d="M646 220 C690 220,680 130,724 130"/>
      <path d="M646 220 C690 220,680 320,724 320"/>
      <path d="M816 130 C856 130,854 130,894 130"/>
      <path d="M986 130 C1026 130,1024 130,1064 130"/>
    </g>
    <!-- wires (flow) -->
    <g fill="none" stroke-width="2.4">
      <path class="wire" d="M136 220 C176 220,174 220,214 220" stroke="#FF8A50"/>
      <path class="wire" d="M306 220 C346 220,344 220,384 220" stroke="#FF8A50"/>
      <path class="wire" d="M476 220 C516 220,514 220,554 220" stroke="#FF8A50"/>
      <path class="wire" d="M646 220 C690 220,680 130,724 130" stroke="#FBBF24"/>
      <path class="wire" d="M646 220 C690 220,680 320,724 320" stroke="#78716C"/>
      <path class="wire" d="M816 130 C856 130,854 130,894 130" stroke="#FBBF24"/>
      <path class="wire" d="M986 130 C1026 130,1024 130,1064 130" stroke="#FDE68A"/>
    </g>
    <text x="630" y="120" class="mono" font-size="11" fill="#FBBF24">✓ match</text>
    <text x="640" y="350" class="mono" font-size="11" fill="#78716C">✗ no match</text>

    <!-- nodes -->
    <g class="sans" font-size="38" text-anchor="middle">
      <rect class="nd"    x="44"   y="174" width="92" height="92" rx="46" fill="#1F1917" stroke-width="2.4"/><text x="90"   y="234">⏰</text>
      <rect class="nd t1" x="214"  y="174" width="92" height="92" rx="18" fill="#1F1917" stroke="#3A2F2B" stroke-width="2.4"/><text x="260"  y="234">🕷️</text>
      <rect class="nd t2" x="384"  y="174" width="92" height="92" rx="18" fill="#1F1917" stroke="#3A2F2B" stroke-width="2.4"/><text x="430"  y="234">🧹</text>
      <rect class="nd t3" x="554"  y="174" width="92" height="92" rx="18" fill="#1F1917" stroke="#3A2F2B" stroke-width="2.4"/><text x="600"  y="234">🔀</text>
      <rect class="nd t4" x="724"  y="84"  width="92" height="92" rx="18" fill="#1F1917" stroke-width="2.4"/><text x="770"  y="144">🧠</text>
      <rect class="nd t5" x="894"  y="84"  width="92" height="92" rx="18" fill="#1F1917" stroke-width="2.4"/><text x="940"  y="144">🗄️</text>
      <rect class="nd t6" x="1064" y="84"  width="92" height="92" rx="18" fill="#1F1917" stroke-width="2.4"/><text x="1110" y="144">📈</text>
      <rect x="724" y="274" width="92" height="92" rx="18" fill="#1F1917" stroke="#3A2F2B" stroke-width="2.4" stroke-dasharray="5 5"/><text x="770" y="334">🗃️</text>
    </g>

    <!-- labels -->
    <g class="mono" text-anchor="middle">
      <g font-size="13" font-weight="700" fill="#F5F5F4">
        <text x="90" y="290">Schedule</text>
        <text x="260" y="290">Apify Scrape</text>
        <text x="430" y="290">De-dupe</text>
        <text x="600" y="290">IF ICP fit</text>
        <text x="770" y="200">LLM Enrich</text>
        <text x="940" y="200">Supabase</text>
        <text x="1110" y="200">Route to CRM</text>
        <text x="770" y="390">Archive</text>
      </g>
      <g font-size="11" fill="#78716C">
        <text x="90" y="307">cron · webhook</text>
        <text x="260" y="307">LinkedIn · web</text>
        <text x="430" y="307">merge · clean</text>
        <text x="600" y="307">score · filter</text>
        <text x="770" y="217">structured JSON</text>
        <text x="940" y="217">source of truth</text>
        <text x="1110" y="217">notify · follow-up</text>
        <text x="770" y="407">log &amp; skip</text>
      </g>
    </g>

    <!-- error workflow card -->
    <rect x="904" y="270" width="250" height="110" rx="16" fill="#1A1010" stroke="#F87171" stroke-opacity=".45" stroke-dasharray="6 5"/>
    <text x="924" y="300" class="mono" font-size="13" font-weight="700" fill="#FCA5A5">⚠ Error Workflow</text>
    <text x="924" y="326" class="mono" font-size="12" fill="#A8A29E">retry → alert → log</text>
    <text x="924" y="346" class="mono" font-size="12" fill="#A8A29E">edge cases tested</text>
    <text x="924" y="366" class="mono" font-size="12" fill="#A8A29E">modular sub-workflows</text>

    <!-- execution packet -->
    <circle r="5.5" fill="#FDE68A" filter="url(#soft)">
      <animateMotion dur="4.2s" repeatCount="indefinite" path="M90 220 H600 C690 220,680 130,770 130 H1110"/>
    </circle>
    <circle r="4" fill="#78716C">
      <animateMotion dur="4.2s" begin="2.1s" repeatCount="indefinite" path="M90 220 H600 C690 220,680 320,770 320"/>
    </circle>
  </g>
</svg>
