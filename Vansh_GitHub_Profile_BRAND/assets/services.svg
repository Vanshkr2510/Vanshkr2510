<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300">
<defs><linearGradient id="ember" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#FF6D3A"/><stop offset="0.55" stop-color="#FBBF24"/><stop offset="1" stop-color="#FDE68A"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;0.6 0;0 0" dur="7s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="emberS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6D3A"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C0A09"/><stop offset="1" stop-color="#1C1412"/></linearGradient>
<pattern id="canvas" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#2E2522"/></pattern>
<filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="frame"><rect width="1200" height="300" rx="24"/></clipPath><style>.mono{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,monospace}
.sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
.live{animation:live 1.5s ease-in-out infinite} @keyframes live{50%{opacity:.25}}
.wire{stroke-dasharray:3 7;animation:flow .9s linear infinite} @keyframes flow{to{stroke-dashoffset:-20}}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both} .r2{animation-delay:.2s} .r3{animation-delay:.4s} .r4{animation-delay:.6s} .r5{animation-delay:.8s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.nd{animation:ping 3s ease-in-out infinite} .k2{animation-delay:.6s} .k3{animation-delay:1.2s} .k4{animation-delay:1.8s} .k5{animation-delay:2.4s}
@keyframes ping{0%,100%{stroke:#3A2F2B}20%{stroke:#FF8A50}40%{stroke:#3A2F2B}}</style></defs>
<g clip-path="url(#frame)"><rect width="1200" height="300" fill="url(#bg)"/><rect width="1200" height="300" fill="url(#canvas)"/>
